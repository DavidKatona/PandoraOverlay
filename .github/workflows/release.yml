name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # The steps below only run on version tags (v1.0.0, v1.1.0, ...):
      # publish a framework-dependent build, zip it, and attach it to a
      # GitHub Release. Players need the .NET 8 Desktop Runtime installed.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish PandoraOverlay.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish\* -DestinationPath "PandoraOverlay-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PandoraOverlay-*.zip
          generate_release_notes: true
