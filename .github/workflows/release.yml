name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # The steps below only run on version tags (v1.30.0, v1.30.0-rc.1, ...).
      # The tag must match the csproj's <Version>: that is the one source of
      # truth, and the packer stamps the number on the update package.
      # A pre-release tag needs the csproj set to match, e.g. <Version>1.30.0-rc.1</Version>
      # (SemVer; the SDK derives the assembly version 1.30.0.0 from it).
      - name: Check the version
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          if (-not (Select-String -Path PandoraOverlay.csproj -Pattern "<Version>$([regex]::Escape($version))</Version>" -Quiet)) {
            throw "Tag ${{ github.ref_name }} does not match the <Version> in PandoraOverlay.csproj"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # A framework-dependent build: players need the .NET 8 Desktop Runtime
      # and, since v1.31 (the in-app sign-in), Microsoft's WebView2 Runtime —
      # the installer fetches either when it is missing.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish PandoraOverlay.csproj -c Release -r win-x64 --self-contained false -o publish

      # The release notes (1.32): the version's CHANGELOG section — for a
      # pre-release tag the "## [Unreleased]" one, since the CHANGELOG stays
      # there until the final (the same rule as ReleaseNotes.SectionFor in the
      # app). They go into the update package, where the overlay's update card
      # reads them, and are the GitHub release text. No notes, no release.
      # (The plain zip was dropped in 1.32: one download each for 1.30 and 1.31.)
      # Players read these on the card, so a CHANGELOG section is written for
      # them, not for the code.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $heading = if ($version.Contains('-')) { 'Unreleased' } else { $version }
          $lines = @(Get-Content CHANGELOG.md -Encoding utf8)
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i].TrimEnd().StartsWith("## [$heading]")) { $start = $i; break } }
          if ($start -lt 0) { throw "CHANGELOG.md has no '## [$heading]' section" }
          $section = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) { $section.Add($lines[$i]) }
          $notes = ($section -join "`n").Trim()
          if (-not $notes) { throw "The '## [$heading]' section of CHANGELOG.md is empty" }
          [IO.File]::WriteAllText("notes.md", $notes + "`n")
          $tag = '${{ github.ref_name }}'
          $files = @(
            '---',
            '',
            '**Which file?**',
            "- ``PandoraOverlay-$tag-Setup.exe`` installs the overlay (no admin rights needed) with Start menu and Desktop shortcuts. It updates itself with one click from the tray menu.",
            "- ``PandoraOverlay-$tag-win-x64.zip`` is for unpacking into a folder of your own, or over your old one. It updates itself with one click too. Its launcher is ``Pandora Overlay.exe``; an old ``PandoraOverlay.exe`` left in the folder can be deleted.",
            '',
            'The other files are what the one-click update reads. Your settings, waypoints and session live in `%AppData%\PandoraOverlay`.'
          )
          [IO.File]::WriteAllText("release-body.md", $notes + "`n`n" + ($files -join "`n") + "`n")
          Get-Content release-body.md

      # Velopack (v1.30): the installer, the self-updating zip and the update
      # package the overlay's updater reads. The previous release is fetched
      # first so this one also gets a small delta package (there is none to
      # fetch before the first Velopack release, hence continue-on-error).
      # The packer's version equals the Velopack package in PandoraOverlay.csproj:
      # bump both together.
      - name: Install Velopack's packer
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet tool install -g vpk --version 1.2.161

      # --pre: Velopack's prerelease flag means pre-releases AND full releases,
      # newest first, so the delta is made against the newest release of either kind.
      - name: Fetch the previous release (for the delta)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --pre

      # The flags, as learned in the updater trial and the rc rounds (Oct 2026):
      # --runtime win-x64: vpk defaults to x86.
      # --packTitle is the name on the shortcuts, in the Start menu and in the
      #   installed-apps list, AND the name of the zip's launcher ("Pandora
      #   Overlay.exe", not the main exe). The owner chose the readable name
      #   (Oct 6 2026) over "PandoraOverlay", which would have replaced the old
      #   exe when the zip is unpacked over an old folder; the old exe stays
      #   beside it, and the release text says it can be deleted.
      # --shortcuts Desktop,StartMenuRoot: the owner wants a Desktop shortcut too.
      #   Changing the title or the shortcuts is safe for installed copies: an
      #   update renames or creates them in place.
      # --framework ...,webview2: Setup.exe fetches the .NET 8 Desktop Runtime
      #   and the WebView2 Runtime where they are missing.
      # Not code-signed (owner's call): SignPath Foundation, the free route,
      #   signs only as a pipeline step, which fits Velopack badly (its helpers
      #   inside the update package would stay unsigned), and Azure Artifact
      #   Signing is closed to EU individuals. So SmartScreen asks once for a
      #   downloaded installer or zip; the in-app updates carry no download mark
      #   and are never prompted. Seen with Bitdefender, SentinelOne and Defender
      #   (Windows 10 and 11): that one prompt, no block. Untested: Smart App
      #   Control, and a PC without .NET 8 or WebView2 (the installer's fetch).
      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk pack --packId PandoraOverlay --packVersion ${{ steps.version.outputs.version }}
          --packDir publish --mainExe PandoraOverlay.exe --packTitle "Pandora Overlay" --packAuthors DavidKatona
          --icon Assets\app.ico --runtime win-x64 --framework net8.0-x64-desktop,webview2 --shortcuts Desktop,StartMenuRoot
          --releaseNotes notes.md --outputDir Releases

      # Human-facing names carry the version; the update files keep the names the updater expects.
      - name: Name the files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Rename-Item Releases\PandoraOverlay-win-Setup.exe "PandoraOverlay-${{ github.ref_name }}-Setup.exe"
          Rename-Item Releases\PandoraOverlay-win-Portable.zip "PandoraOverlay-${{ github.ref_name }}-win-x64.zip"
          Get-ChildItem Releases

      # A tag with a "-" (v1.30.0-rc.1) is a pre-release: players' overlays
      # ignore it, only a pre-release build offers it.
      # The body is the notes and "Which file?" only: GitHub's generated commit
      # list stays off — commit titles are written for the code, not for players.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-body.md
          files: |
            Releases/*
